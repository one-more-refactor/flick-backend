name: audit
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
  push:
    paths: ["Cargo.lock", ".cargo/audit.toml"]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
